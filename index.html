<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Agorà del sapere</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agorà">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..800;1,6..96,500..700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* VOICE everyday learning: calm and vivid, built to make you remember, not just consume
   IDEA a deck of Pompeian fresco panels: a pigment field, a fine ivory frame, a painted vignette in the middle
   PICTURE each card's vignette: a medallion with its subject drawn in ivory and gold, a cast shadow, a seeded ornament behind
   COLOUR four ancient pigments as suits (Pompeian red, lapis, burnt ochre, verdigris), Pompeian black for reviews; ivory ink, gold accent
   TYPE Bodoni Moda for titles and questions, Figtree for reading and controls
   LAYOUT one card per screen: vignette fills the space above the text, action rail on the right as on TikTok; wide screens keep a 700px column */
:root{color-scheme:dark;--iv:#f7ecd6;--shd:rgba(0,0,0,.26);--ui:#1b1915;--ui2:#272420;--line:rgba(247,236,214,.16);--gold:#f2c24c}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--ui);color:var(--iv);font:16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#feed{height:100%;overflow-y:auto;overflow-x:hidden;scroll-snap-type:y mandatory;overscroll-behavior-y:contain;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}
.card{--fd:#1d1a16;--fd2:#0e0c0a;--md:#2d2923;--ac:var(--gold);--iv2:#cdbf9f;position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;overflow:hidden;background:var(--fd);touch-action:manipulation;-webkit-user-select:none;user-select:none}
.card::after{content:"";position:absolute;inset:7px;border:1px solid rgba(247,236,214,.28);border-radius:3px;pointer-events:none}
.s-storia{--fd:#9b2c20;--fd2:#6b1c15;--md:#b5473a;--iv2:#e3c6a3}
.s-filosofia{--fd:#24418f;--fd2:#162a63;--md:#3858aa;--iv2:#d3cbc4}
.s-mente{--fd:#965c10;--fd2:#653e07;--md:#b0762a;--ac:#fff1c9;--iv2:#e9cfa4}
.s-scienza{--fd:#0f5f5a;--fd2:#073f3b;--md:#23786f;--iv2:#cdd6c6}
.s-cultura{--fd:#6b1e4c;--fd2:#44102f;--md:#8a3566;--iv2:#e6cbd6}
.pic{position:relative;flex:1 1 auto;min-height:92px;margin-top:calc(52px + env(safe-area-inset-top,0px))}
.pic svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.o1 *{fill:rgba(255,255,255,.055)}
.o2 *{fill:none;stroke:rgba(255,255,255,.075);stroke-width:1.5}
.o3 *{fill:none;stroke:rgba(255,255,255,.045);stroke-width:5}
.m0{fill:var(--md)}
.m1{fill:none;stroke:rgba(247,236,214,.5);stroke-width:1.2}
.m2{fill:none;stroke:var(--ac);stroke-width:3;stroke-linecap:round}
.em .a{fill:var(--iv)}
.em .b{fill:var(--iv2)}
.em .c{fill:var(--ac)}
.em .k{fill:var(--fd2)}
.em .d{fill:rgba(0,0,0,.16)}
.em .sa,.em .sb,.em .sc,.em .sk{fill:none;stroke-linecap:round;stroke-linejoin:round}
.em .sa{stroke:var(--iv)}
.em .sb{stroke:var(--iv2)}
.em .sc{stroke:var(--ac)}
.em .sk{stroke:var(--fd2)}
.em .sh .a,.em .sh .b,.em .sh .c{fill:var(--shd)}
.em .sh .sa,.em .sh .sb,.em .sh .sc{stroke:var(--shd)}
.em .sh .k,.em .sh .sk,.em .sh .d{display:none}
.txt{position:relative;flex:0 0 auto;width:min(100%,700px);margin:0 auto;padding:8px 84px calc(26px + env(safe-area-inset-bottom,0px)) 24px}
.card:not([data-t=card]) .txt{padding-right:24px}
.kick{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:0 0 6px;font-size:14px;font-weight:600;color:rgba(247,236,214,.82)}
.kick b{color:var(--iv)}
.tag{padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.24);color:var(--iv);font-size:13px}
.card h2{margin:0 0 10px;font:700 clamp(25px,4vh,36px)/1.07 "Bodoni Moda","Bodoni 72",Didot,Georgia,serif;letter-spacing:-.01em;text-wrap:balance}
.body{margin:0;font-size:clamp(15px,2.3vh,17px);line-height:1.5}
.line{margin:12px 0 0;font:italic 600 clamp(15.5px,2.4vh,18.5px)/1.32 "Bodoni Moda","Bodoni 72",Georgia,serif;color:var(--ac)}
.big{margin:0 0 6px;font:800 clamp(46px,8.5vh,72px)/1 "Bodoni Moda","Bodoni 72",Didot,Georgia,serif;letter-spacing:-.02em}
.rail{position:absolute;z-index:2;right:max(10px,calc(50% - 344px));bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.rb{display:flex;flex-direction:column;align-items:center;gap:3px;width:60px;padding:0;border:0;background:none;color:inherit;text-decoration:none;font-size:13px;font-weight:600;line-height:1.2}
.rb i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:rgba(0,0,0,.22);transition:transform .12s}
.rb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.rb.on svg{fill:var(--ac);stroke:var(--ac)}
.rb:active i{transform:scale(.9)}
body:not(.ai) .aionly{display:none!important}
body:not(.ext) .extonly{display:none!important}
a.btn{display:inline-flex;align-items:center;color:inherit;text-decoration:none}
a.btn.pri{color:#1b1915}
.qz h2{font-size:clamp(23px,3.6vh,31px)}
.opts{display:grid;gap:10px;margin-top:6px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:11px 14px;text-align:left;border:1.5px solid rgba(247,236,214,.38);border-radius:12px;background:rgba(255,255,255,.04);font-size:16px;font-weight:600;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--iv)}
.opt:disabled{cursor:default}
.opt:disabled:not(.ok):not(.no){opacity:.5}
.opt svg{flex:none;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.opt.ok{border-color:#8fd3a0;background:rgba(143,211,160,.15);color:#d4f4da}
.opt.no{border-color:#ff9f8e;background:rgba(255,159,142,.13);color:#ffd7cf}
.fb{margin:12px 0 0;font-size:15px;line-height:1.45}
.fb .note{display:block;margin-top:4px}
.how{display:grid;gap:10px;margin:14px 0 0;padding:0;list-style:none}
.how li{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;line-height:1.4}
.how svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--ac);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.btn{min-height:46px;padding:10px 18px;border:1.5px solid rgba(247,236,214,.45);border-radius:12px;background:none;font-size:15.5px;font-weight:700}
.btn.pri{background:var(--iv);border-color:var(--iv);color:#1b1915}
.note{font-size:13.5px;color:rgba(247,236,214,.66)}
#top{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:6px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0 4px;background:linear-gradient(rgba(0,0,0,.42),rgba(0,0,0,0));pointer-events:none}
#top>*{pointer-events:auto}
#tabs{flex:1;display:flex;overflow-x:auto;scrollbar-width:none;padding:0 6px;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;position:relative;display:flex;align-items:center;gap:5px;min-height:44px;padding:0 10px;border:0;background:none;font-size:15px;font-weight:600;color:rgba(247,236,214,.74);white-space:nowrap}
.tab[aria-selected=true]{color:var(--iv)}
.tab[aria-selected=true]::after{content:"";position:absolute;left:10px;right:10px;bottom:6px;height:2px;border-radius:2px;background:var(--iv)}
.due{min-width:20px;padding:0 6px;border-radius:99px;background:var(--gold);color:#1b1915;font-size:13px;font-weight:700;line-height:20px;text-align:center}
.due:empty{display:none}
#me{flex:none;display:flex;align-items:center;gap:5px;min-height:40px;padding:0 13px 0 10px;border:1px solid rgba(247,236,214,.35);border-radius:99px;background:rgba(0,0,0,.28);font-size:15px;font-weight:700}
#me svg{width:18px;height:18px;fill:var(--gold)}
.burst{position:absolute;z-index:5;width:110px;height:110px;margin:-55px 0 0 -55px;pointer-events:none;animation:pop .75s ease-out forwards}
.burst svg{width:100%;height:100%;fill:var(--ac);stroke:none}
@keyframes pop{0%{transform:scale(.3) rotate(-14deg);opacity:0}25%{transform:scale(1.12) rotate(-8deg);opacity:1}65%{transform:scale(1) rotate(-8deg);opacity:1}100%{transform:translateY(-46px) scale(1.25) rotate(-8deg);opacity:0}}
#scrim{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;z-index:31;left:0;right:0;bottom:0;display:flex;flex-direction:column;width:min(100%,720px);max-height:88%;margin:0 auto;background:var(--ui);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s}
#sheet.on{transform:none;visibility:visible;transition:transform .25s ease,visibility 0s}
.sh-h{display:flex;align-items:flex-start;gap:12px;padding:16px 12px 12px 20px;border-bottom:1px solid var(--line)}
.sh-h>div{flex:1}
.sh-h small{display:block;margin-bottom:3px;font-size:13px;font-weight:600;color:rgba(247,236,214,.66)}
.sh-h h3{margin:0;font:700 clamp(22px,5vw,27px)/1.12 "Bodoni Moda","Bodoni 72",Georgia,serif;text-wrap:balance}
.x{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--ui2)}
.x svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.sh-b{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:16px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.dp{margin:0;white-space:pre-line;font-size:16.5px;line-height:1.6;-webkit-user-select:text;user-select:text}
.rl{margin:14px 0 0;font:italic 600 18px/1.35 "Bodoni Moda","Bodoni 72",Georgia,serif;color:var(--gold)}
.ask{margin:20px 0 6px;font-weight:700;color:var(--gold)}
.qf{display:flex;gap:8px;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.qf input{flex:1;min-height:46px;padding:0 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--ui2);color:var(--iv);font:16px Figtree,system-ui,sans-serif}
.qf input:focus{outline:2px solid var(--gold);outline-offset:1px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5em,1fr));gap:10px}
.st{padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--ui2)}
.st b{display:block;font:700 34px/1.05 "Bodoni Moda","Bodoni 72",Georgia,serif;font-variant-numeric:lining-nums}
.st span{font-size:13.5px;color:rgba(247,236,214,.72)}
.h4{margin:24px 0 10px;font-size:15px;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;max-width:250px}
.days i{aspect-ratio:1;border-radius:4px;background:rgba(247,236,214,.08)}
.days i.on{background:var(--gold)}
.days i.today{outline:2px solid var(--iv);outline-offset:1px}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:6.2em minmax(0,1fr) 2.6em;align-items:center;gap:10px;font-size:14.5px}
.bar u{display:block;height:10px;border-radius:5px;background:rgba(247,236,214,.1);overflow:hidden;text-decoration:none}
.bar s{display:block;height:100%;border-radius:5px;text-decoration:none}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
.sv{display:flex;align-items:center;gap:12px;width:100%;min-height:54px;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.sv i{flex:none;width:14px;height:14px;border-radius:3px}
.sv span{flex:1;font-weight:600;line-height:1.3}
.sv small{display:block;margin-top:2px;font-size:13px;font-weight:500;color:rgba(247,236,214,.66)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.row>span{font-weight:600}
.row .note{display:block;margin-top:2px;font-weight:500}
.sw{position:relative;flex:none;width:54px;height:32px;border:0;border-radius:99px;background:rgba(247,236,214,.22);transition:background .2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--iv);transition:transform .2s}
.sw[aria-checked=true]{background:#3e8f5b}
.sw[aria-checked=true]::after{transform:translateX(22px)}
#toast{position:fixed;z-index:40;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));max-width:calc(100% - 32px);padding:10px 18px;border-radius:99px;background:var(--iv);color:#1b1915;font-size:14.5px;font-weight:700;transform:translateX(-50%);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
/* movimento: solo la scheda attiva (.on) si anima, ogni simbolo a modo suo */
.em [class*="x-"]{transform-box:fill-box;transform-origin:center}
.em .x-sway,.em .x-flick,.em .x-roll,.em .x-sandt,.em .x-sandb{transform-origin:50% 100%}
.em .x-flickd{transform-origin:50% 0%}
.em .x-page,.em .x-wavef{transform-origin:0% 50%}
.em .x-write,.em .x-brush{transform-origin:0% 100%}
.em .x-shine{opacity:0}
.em .sh .x-shine{display:none}
.fx{opacity:0;transition:opacity .6s;pointer-events:none}
.card.on .fx{opacity:1}
.fx .pa{fill:rgba(247,236,214,.8)}
.fx .pg{fill:var(--ac)}
.fx .pl{fill:none;stroke:rgba(247,236,214,.45);stroke-width:1.4;stroke-linecap:round}
.fx .pr{fill:none;stroke:rgba(247,236,214,.6);stroke-width:1.2}
.fx .pk{fill:none;stroke:rgba(0,0,0,.25);stroke-width:1}
.fx .pn{fill:none;stroke:var(--ac);stroke-width:1.6;stroke-linecap:round}
.fx .pt{font:600 20px "Bodoni Moda","Bodoni 72",Georgia,serif;fill:rgba(247,236,214,.55)}
.fx .f-tw,.fx .f-coin,.fx .f-leaf{transform-box:fill-box;transform-origin:center}
.line span{padding-bottom:2px;background:linear-gradient(currentColor,currentColor) 0 100%/0 1.5px no-repeat;-webkit-box-decoration-break:clone;box-decoration-break:clone}
@media (prefers-reduced-motion:no-preference){
.card.on .md{animation:breath 6s ease-in-out infinite}
.card.on .bd .o1{animation:x-spin 90s linear infinite}
.card.on .bd .o2{animation:ring 5s ease-in-out infinite}
.card.on .bd .o3{animation:hatch 2.4s linear infinite}
.card.on .line span{animation:ul 1.1s .5s ease forwards}
.card.on .x-sway{animation:x-rot 2.8s ease-in-out infinite}
.card.on .x-rock{animation:x-rot 3.4s ease-in-out infinite}
.card.on .x-spin{animation:x-spin 9s linear infinite}
.card.on .x-spinr{animation:x-spinr 9s linear infinite}
.card.on .x-flick,.card.on .x-flickd{animation:x-flick .9s ease-in-out infinite}
.card.on .x-blink{animation:x-blink 4.2s ease-in-out infinite}
.card.on .x-look{animation:x-look 5s ease-in-out infinite}
.card.on .x-pulse{animation:x-pulse 2.4s ease-in-out infinite}
.card.on .x-tw{animation:x-tw 2.2s ease-in-out infinite}
.card.on .x-soft{animation:x-soft 3s ease-in-out infinite}
.card.on .x-glow{animation:x-glow 2.6s ease-in-out infinite}
.card.on .x-osc{animation:x-osc 2.2s ease-in-out infinite}
.card.on .x-bob{animation:x-bob 3.2s ease-in-out infinite}
.card.on .x-hover{animation:x-hover 2.6s ease-in-out infinite}
.card.on .x-bank{animation:x-bank 3.6s ease-in-out infinite}
.card.on .x-shake{animation:x-shake .18s linear infinite}
.card.on .x-sandt{animation:x-sandt 4s ease-in infinite}
.card.on .x-sandb{animation:x-sandb 4s ease-in infinite}
.card.on .x-flip{animation:x-flip 2.6s ease-in-out infinite}
.card.on .x-page{animation:x-page 3.6s ease-in-out infinite}
.card.on .x-steam{animation:x-steam 2.6s ease-out infinite}
.card.on .x-bub{animation:x-bub 2.4s ease-in infinite}
.card.on .x-beam{animation:x-beam 3s ease-in-out infinite}
.card.on .x-panl{animation:x-panl 3s ease-in-out infinite}
.card.on .x-panr{animation:x-panr 3s ease-in-out infinite}
.card.on .x-wavef{animation:x-wavef 1.5s ease-in-out infinite}
.card.on .x-strum{animation:x-strum 2.4s linear infinite}
.card.on .x-rise{animation:x-rise 5s ease-in-out infinite}
.card.on .x-roll{animation:x-roll 2s ease-in-out infinite}
.card.on .x-write{animation:x-write .7s ease-in-out infinite}
.card.on .x-brush{animation:x-write 1.1s ease-in-out infinite}
.card.on .x-squeeze{animation:x-squeeze 3.2s ease-in-out infinite}
.card.on .x-sig{animation:x-sig 1.8s ease-out infinite}
.card.on .x-turn{animation:x-turn 3s ease-in-out infinite}
.card.on .x-shine{animation:x-shine 3.2s ease-in-out infinite}
.card.on .x-draw{stroke-dasharray:60;animation:x-draw 3.4s ease-in-out infinite both}
.card.on .x-slow{animation-duration:6s}
.card.on .x-slower{animation-duration:24s}
.card.on .x-d1{animation-delay:.3s}
.card.on .x-d2{animation-delay:.6s}
.card.on .x-d3{animation-delay:.9s}
.card.on .fx [class*="f-"]{animation-iteration-count:infinite;animation-timing-function:linear}
.card.on .fx .f-fall{animation-name:f-fall}
.card.on .fx .f-fall2{animation-name:f-fall2}
.card.on .fx .f-rain{animation-name:f-rain}
.card.on .fx .f-rise{animation-name:f-rise}
.card.on .fx .f-rise2{animation-name:f-rise2}
.card.on .fx .f-coin{animation-name:f-coin}
.card.on .fx .f-leaf{animation-name:f-leaf}
.card.on .fx .f-tw{animation-name:f-tw;animation-timing-function:ease-in-out}
}
@keyframes breath{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes ring{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes hatch{to{transform:translateX(16px)}}
@keyframes ul{to{background-size:100% 1.5px}}
@keyframes x-rot{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes x-spin{to{transform:rotate(360deg)}}
@keyframes x-spinr{to{transform:rotate(-360deg)}}
@keyframes x-flick{0%,100%{transform:scale(1,1)}25%{transform:scale(.93,1.08) skewX(-3deg)}50%{transform:scale(1.05,.94)}75%{transform:scale(.97,1.05) skewX(3deg)}}
@keyframes x-blink{0%,88%,100%{transform:scaleY(1)}93%{transform:scaleY(.08)}}
@keyframes x-look{0%,25%,100%{transform:translateX(0)}35%,55%{transform:translateX(-6px)}65%,85%{transform:translateX(6px)}}
@keyframes x-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes x-tw{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes x-soft{0%,100%{opacity:1}50%{opacity:.8}}
@keyframes x-glow{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes x-osc{0%,100%{transform:translateX(-4px)}50%{transform:translateX(4px)}}
@keyframes x-bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-4px) rotate(2deg)}}
@keyframes x-hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

function readLocal(){try{const v=JSON.parse(localStorage.getItem(LSK)||'null');return v&&typeof v==='object'?v:null}catch(e){return null}}
function merge(a,b){
 if(!b||typeof b!=='object')return a;
 const o=def(),nb=(b.t||0)>(a.t||0);
 o.t=Math.max(a.t||0,b.t||0);
 o.rm=Object.assign({},a.rm||{});for(const k in(b.rm||{}))o.rm[k]=Math.max(o.rm[k]||0,+b.rm[k]||0);
 const sa=a.seen||{},sb=b.seen||{};
 for(const id of new Set([...Object.keys(sa),...Object.keys(sb)])){const x=sa[id],y=sb[id];o.seen[id]=!x?y:!y?x:((y.u||0)>(x.u||0)?y:x)}
 const la=a.liked||{},lb=b.liked||{};
 for(const id of new Set([...Object.keys(la),...Object.keys(lb)])){const x=la[id],y=lb[id],v=!x?y:!y?x:((y.at||0)>(x.at||0)?y:x);if(v&&(v.at||0)>(o.rm['l:'+id]||0))o.liked[id]=v}
 const sv=new Map();for(const s of[...(a.saved||[]),...(b.saved||[])]){if(!s||!s.id)continue;const p=sv.get(s.id);if(!p||(s.at||0)>(p.at||0))sv.set(s.id,s)}
 o.saved=[...sv.values()].filter(s=>(s.at||0)>(o.rm['s:'+s.id]||0)).sort((x,y)=>(y.at||0)-(x.at||0));
 o.days=[...new Set([...(a.days||[]),...(b.days||[])])].sort().slice(-150);
 for(const k of['cards','qr','qw'])o.st[k]=Math.max((a.st||{})[k]||0,(b.st||{})[k]||0);
 o.ai=nb?!!b.ai:!!a.ai;
 const gm=new Map();for(const g of[...(a.gen||[]),...(b.gen||[])])if(g&&g.id&&!gm.has(g.id))gm.set(g.id,g);
 o.gen=[...gm.values()].sort((x,y)=>(x.ts||0)-(y.ts||0)).slice(-60);
 o.rm=Object.fromEntries(Object.entries(o.rm).sort((x,y)=>y[1]-x[1]).slice(0,300));
 return o;
}
function save(){S.t=Date.now();try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}dirty=true;clearTimeout(wT);wT=setTimeout(flush,2500)}
async function flush(){
 if(!dref||!dirty)return;
 if(writing){clearTimeout(wT);wT=setTimeout(flush,1500);return}
 dirty=false;writing=true;
 const body=JSON.parse(JSON.stringify(S));
 while(JSON.stringify(body).length>230000&&body.gen.length>4)body.gen.shift();
 try{await dref.set(body);retried=false}
 catch(e){const c=e&&e.code;
  if(c==='unavailable'&&!retried){retried=true;dirty=true;clearTimeout(wT);wT=setTimeout(flush,1500+Math.random()*2500)}
  else if(c==='unavailable'||c==='resource_exhausted')dirty=true;
  else dref=null}
 finally{writing=false}
}

function build(){
 deck=[];byId={};
 for(const c of seed)if(c&&c.id&&SUITS.includes(c.c)&&c.t){deck.push(c);byId[c.id]=c}
 for(const c of S.gen)if(c&&c.id&&!byId[c.id]&&SUITS.includes(c.c)&&c.t){deck.push(c);byId[c.id]=c}
 for(const s of S.saved)if(s&&s.card&&s.card.t&&!byId[s.id])byId[s.id]=s.card;
}
function weights(){const w=Object.assign({},BASEW),n={};for(const id in S.liked){const c=S.liked[id]&&S.liked[id].c;n[c]=(n[c]||0)+1}for(const k in w)w[k]*=1+.15*Math.min(n[k]||0,10);return w}
function unseenLeft(){let n=0;for(const c of deck)if(!S.seen[c.id]&&shownAt[c.id]===undefined&&(!filter||c.c===filter))n++;return n}
function pickNew(){
 const pool=deck.filter(c=>!S.seen[c.id]&&shownAt[c.id]===undefined&&(!filter||c.c===filter));
 if(!pool.length)return null;if(filter)return pick(pool);
 const w=weights(),g={};for(const c of pool)(g[c.c]=g[c.c]||[]).push(c);
 const ks=Object.keys(g);let tot=0;for(const k of ks)tot+=w[k]||.3;let r=Math.random()*tot;
 for(const k of ks){r-=w[k]||.3;if(r<=0)return pick(g[k])}return pick(g[ks[0]]);
}
function pickAgain(pos){
 const pool=deck.filter(c=>S.seen[c.id]&&(!filter||c.c===filter)&&(shownAt[c.id]===undefined||pos-shownAt[c.id]>40));
 if(!pool.length)return null;pool.sort((a,b)=>(S.seen[a.id].ls||0)-(S.seen[b.id].ls||0));return pick(pool.slice(0,8));
}
function pickQuiz(pos,any){
 const now=Date.now(),c=[];
 for(const id in S.seen){const e=S.seen[id],k=byId[id];if(!e||!k||!Array.isArray(k.q)||k.q.length<4)continue;
  if(filter&&k.c!==filter)continue;
  if(shownAt[id]!==undefined&&pos-shownAt[id]<4)continue;
  if(quizAt[id]!==undefined&&(mode==='ripasso'||pos-quizAt[id]<12))continue;
  if(!any&&(e.d||0)>now)continue;
  c.push([e.b||0,e.d||0,id])}
 if(!c.length)return null;c.sort((x,y)=>x[0]-y[0]||x[1]-y[1]);return byId[pick(c.slice(0,4))[2]];
}
function cardsSinceQuiz(){let n=0;for(let i=items.length-1;i>=0;i--){const t=items[i].type;if(t==='quiz')break;if(t==='card')n++}return n}
const pendGen=()=>items.slice(Math.max(act,0)).some(x=>x.type==='gen'||x.type==='promo');
function cardItem(c,pos,again){shownAt[c.id]=pos;return{type:'card',card:c,again}}
function quizItem(c,pos,extra){quizAt[c.id]=pos;return{type:'quiz',card:c,extra,opts:shuffle([c.q[1],c.q[2],c.q[3]])}}
function nextItem(){
 const pos=items.length;
 if(mode==='ripasso'){let c=pickQuiz(pos,false),x=false;if(!c){c=pickQuiz(pos,true);x=!!c}return c?quizItem(c,pos,x):{type:'end',k:Object.keys(S.seen).length?'ripdone':'ripempty'}}
 if(Object.keys(S.seen).length>=3&&cardsSinceQuiz()>=5){const c=pickQuiz(pos,false);if(c)return quizItem(c,pos,false)}
 const c=pickNew();if(c)return cardItem(c,pos,false);
 if(sample&&!aiOff){
  if(!S.ai){if(!promoShown&&!pendGen()){promoShown=true;endShown=true;return{type:'promo'}}}
  else{maybeGen();if((genBusy||genFail)&&!pendGen())return{type:'gen'};endShown=true}
 }
 if(!endShown){endShown=true;return{type:'end',k:'deck'}}
 const r=pickAgain(pos);if(r)return cardItem(r,pos,true);

}
function push(it){it.pos=items.length;items.push(it);const el=render(it,it.pos);feed.append(el);io.observe(el)}
function appendMore(n){for(let i=0;i<n;i++){const l=items[items.length-1];if(l&&l.type==='end'&&l.k!=='deck')return;push(nextItem())}}
function reset(first){

function refill(){
 while(items.length>act+1){const it=items.pop(),el=feed.lastElementChild;if(el){io.unobserve(el);el.remove()}
  if(it.type==='card'&&shownAt[it.card.id]===it.pos)delete shownAt[it.card.id];
  if(it.type==='quiz'&&quizAt[it.card.id]===it.pos)delete quizAt[it.card.id];
  if(it.type==='promo')promoShown=false;

}
const io=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&e.intersectionRatio>=.6&&e.target.isConnected)setActive(+e.target.dataset.i)},{root:feed,threshold:[.6]});

 const k=fxOf(c),r=rng(hash(c.id||c.t||'x')+11),R=(a,b)=>a+r()*(b-a),I=(a,b)=>Math.floor(R(a,b));let s='';
 const at=(x,y,sc,inner)=>`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)})${sc?' scale('+sc.toFixed(2)+')':''}">${inner}</g>`;
 const an=(d,dl)=>`style="animation-duration:${d.toFixed(1)}s;animation-delay:-${dl.toFixed(1)}s"`;
 const fall=()=>r()<.5?'f-fall':'f-fall2',rise=()=>r()<.5?'f-rise':'f-rise2';
 if(k==='stars')for(let i=0;i<18;i++){const d=R(1.6,3.6);s+=at(R(-195,195),R(-145,145),R(.5,1.15),`<path class="pa f-tw" ${an(d,R(0,d))} d="M0 -5L1.2 -1.2L5 0L1.2 1.2L0 5L-1.2 1.2L-5 0L-1.2 -1.2Z"/>`)}
 else if(k==='snow')for(let i=0;i<22;i++){const d=R(6,11);s+=at(R(-198,198),0,0,`<circle class="pa ${fall()}" r="${R(1.2,2.8).toFixed(1)}" ${an(d,R(0,d))}/>`)}
 else if(k==='rain')for(let i=0;i<26;i++){const d=R(.9,1.5);s+=at(R(-198,198),0,0,`<path class="pl f-rain" d="M0 0l-3 13" ${an(d,R(0,d))}/>`)}
 else if(k==='embers')for(let i=0;i<16;i++){const d=R(4,8);s+=at(R(-190,190),0,0,`<circle class="pg ${rise()}" r="${R(1,2.4).toFixed(1)}" ${an(d,R(0,d))}/>`)}
 else if(k==='bubbles')for(let i=0;i<14;i++){const d=R(5,9);s+=at(R(-190,190),0,0,`<circle class="pr ${rise()}" r="${R(2,5).toFixed(1)}" ${an(d,R(0,d))}/>`)}
 else if(k==='coins')for(let i=0;i<10;i++){const d=R(4,7);s+=at(R(-185,185),0,0,`<g class="f-coin" ${an(d,R(0,d))}><circle class="pg" r="5"/><circle class="pk" r="3"/></g>`)}
 else if(k==='notes')for(let i=0;i<9;i++){const d=R(6,9);s+=at(R(-180,180),0,R(.8,1.3),`<g class="${rise()}" ${an(d,R(0,d))}><ellipse class="pg" rx="4" ry="3" transform="rotate(-20)"/><path class="pn" d="M3.6 -1V-16q6 3 5 9"/></g>`)}
 else if(k==='leaves')for(let i=0;i<10;i++){const d=R(7,11);s+=at(R(-190,190),0,R(.8,1.4),`<path class="${r()<.5?'pg':'pa'} f-leaf" d="M0 -6Q5 0 0 6Q-5 0 0 -6Z" ${an(d,R(0,d))}/>`)}
 else if(k==='letters'){const G='AΩΣαψRβλΦΔπQ';for(let i=0;i<11;i++){const d=R(7,10);s+=at(R(-180,180),0,R(.8,1.4),`<text class="pt ${rise()}" text-anchor="middle" ${an(d,R(0,d))}>${G[I(0,G.length)]}</text>`)}}
 else if(k==='thought')for(let i=0;i<8;i++){const d=R(7,10);s+=at(R(-180,180),0,R(.8,1.5),`<text class="pt ${rise()}" text-anchor="middle" ${an(d,R(0,d))}>?</text>`)}
 else for(let i=0;i<16;i++){const d=R(9,14);s+=at(R(-195,195),0,0,`<circle class="pa ${rise()}" r="${R(.8,1.6).toFixed(1)}" opacity=".6" ${an(d,R(0,d))}/>`)}

function orn(r){
 const t=Math.floor(r()*4);let s='';
 if(t===0){const n=2*(9+Math.floor(r()*8)),o=r()*6.283;for(let i=0;i<n;i+=2){const a=o+i*6.283/n,b=o+(i+1)*6.283/n;s+=`<path d="M0 0L${(420*Math.cos(a)).toFixed(0)} ${(420*Math.sin(a)).toFixed(0)}L${(420*Math.cos(b)).toFixed(0)} ${(420*Math.sin(b)).toFixed(0)}Z"/>`}return`<g class="o1">${s}</g>`}
 if(t===1){for(let k=0;k<10;k++)s+=`<circle r="${100+k*19}"/>`;return`<g class="o2">${s}</g>`}
 if(t===2){for(let y=-140;y<=140;y+=20)for(let x=-200;x<=200;x+=20){const q=3.4-Math.hypot(x,y)/100;if(q>.5)s+=`<circle cx="${x}" cy="${y}" r="${q.toFixed(1)}"/>`}return`<g class="o1">${s}</g>`}
 for(let x=-460;x<=460;x+=16)s+=`<path d="M${x} -160l320 320"/>`;return`<g class="o3">${s}</g>`;
}

Esempio di un elemento: ${JSON.stringify(EX)}`;
 try{
  const arr=await sample.json(prompt,{cache:false,onText:({text})=>{const n=Math.min((text.match(/"q"\s*:/g)||[]).length,GEN_N);if(n!==genProg){genProg=n;updGen()}}});
  const ok=clean(arr);if(!ok.length)throw{code:'invalid_json'};
  for(const c of ok){deck.push(c);byId[c.id]=c;S.gen.push(c)}S.gen=S.gen.slice(-60);save();
  genBusy=false;updGen();refill();toast(ok.length===1?'Una nuova scheda da Claude':ok.length+' nuove schede da Claude');
 }catch(e){genBusy=false;genFail=true;genErr=errMsg(e);if(fatal(e))disableAI();updGen()}
}
function deepPrompt(c){return`Sei un tutor brillante che scrive in italiano per uno studente universitario curioso. Approfondisci questa scheda di un'app di micro-apprendimento.

Scheda (${SN[c.c]||''}${c.k?', '+c.k:''}): «${c.t}»
${c.b}

Scrivi tre paragrafi brevi, 150-200 parole in tutto: il contesto; il punto chiave spiegato meglio, con un esempio concreto; un collegamento sorprendente con un altro tema o con il presente. Se nella scheda c'è un'imprecisione, correggila esplicitamente. Solo testo semplice: niente titoli, elenchi o markdown.`}
function busy(b){const bt=$('#qbt');if(bt){bt.textContent=b?'Ferma':'Chiedi';bt.dataset.busy=b?'1':''}}
async function ask(q){
 const thr=$('#thr');if(!thr||!sample||!dcard)return;
 if(dctl)dctl.abort();
 const ctl=new AbortController();dctl=ctl;
 const blk=document.createElement('div');
 if(q){const p=document.createElement('p');p.className='ask';p.textContent=q;blk.append(p)}
 const out=document.createElement('p');out.className='dp';out.textContent='Claude sta pensando…';blk.append(out);thr.append(blk);
 blk.scrollIntoView({block:'end',behavior:RM?'auto':'smooth'});busy(true);
 let input;
 if(q){if(!turns.length)turns=[{role:'user',content:deepPrompt(dcard)}];turns.push({role:'user',content:q+'\n\n(Rispondi in italiano, in massimo 120 parole, solo testo semplice.)'});if(turns.length>12)turns=[turns[0],turns[1],...turns.slice(-9)];input=turns.slice()}
 else input=deepPrompt(dcard);
 const opts={signal:ctl.signal,onText:({text})=>{out.textContent=text}};if(q)opts.cache=false;
 try{
  const r=await sample(input,opts);
  out.textContent=r.text+(r.truncated?' …':'');
  if(q)turns.push({role:'assistant',content:r.text});else turns=[{role:'user',content:input},{role:'assistant',content:r.text}];
 }catch(e){
  if(q&&turns.length&&turns[turns.length-1].role==='user')turns.pop();
  out.textContent=e&&e.text?e.text:'';
  if(!e||e.code!=='cancelled'){const n=document.createElement('p');n.className='note';n.textContent=errMsg(e);blk.append(n)}
  if(fatal(e))disableAI();
 }finally{if(dctl===ctl){dctl=null;busy(false)}}
}
function openDeep(c){if(!sample||aiOff)return;dcard=c;turns=[];openSheet(`<div class="sh-h"><div><small>Approfondisci con Claude</small><h3>${esc(c.t)}</h3></div>${XB}</div><div class="sh-b" id="thr" aria-live="polite"></div><form class="qf" id="qf"><input id="qin" autocomplete="off" maxlength="300" placeholder="Fai una domanda su questo tema" aria-label="Domanda per Claude"><button class="btn pri" id="qbt" type="submit">Chiedi</button></form>`);ask(null)}

/* ---------- pannelli ---------- */
function openSheet(h){lastFocus=document.activeElement;sheet.innerHTML=h;sheet.classList.add('on');sheet.setAttribute('aria-hidden','false');scrim.classList.add('on');const x=sheet.querySelector('.x');if(x)x.focus({preventScroll:true})}
function closeSheet(){if(dctl)dctl.abort();sheet.classList.remove('on');sheet.setAttribute('aria-hidden','true');scrim.classList.remove('on');if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true})}
const sheetOpen=()=>sheet.classList.contains('on');
function openMe(){
 const ids=Object.keys(S.seen),q=S.st.qr+S.st.qw,pct=q?Math.round(100*S.st.qr/q):0,days=new Set(S.days),d=new Date();d.setDate(d.getDate()-34);
 let cells='';for(let i=0;i<35;i++){const k=ymd(d);cells+=`<i class="${days.has(k)?'on':''}${i===34?' today':''}"></i>`;d.setDate(d.getDate()+1)}
 const per=Object.fromEntries(SUITS.map(s=>[s,0]));for(const id of ids){const c=byId[id];if(c&&has(per,c.c))per[c.c]++}
 const mx=Math.max(1,...Object.values(per));
 const sv=S.saved.map(s=>{const c=byId[s.id]||s.card;return c&&c.t?`<button type="button" class="sv" data-open="${esc(s.id)}"><i style="background:${SCOL[c.c]||'#888'}"></i><span>${esc(c.t)}<small>${esc(SN[c.c]||'')}${c.k?' · '+esc(c.k):''}</small></span></button>`:''}).join('');
 openSheet(`<div class="sh-h"><div><small>Agorà</small><h3>I tuoi progressi</h3></div>${XB}</div><div class="sh-b">
<div class="stats"><div class="st"><b>${ids.length}</b><span>schede lette</span></div><div class="st"><b>${streak()}</b><span>giorni di fila</span></div><div class="st"><b>${q?pct+'%':'–'}</b><span>${q?'risposte giuste su '+q:'risposte giuste'}</span></div><div class="st"><b>${dueCount()}</b><span>da ripassare</span></div></div>
<p class="h4">Ultime cinque settimane</p><div class="days" role="img" aria-label="Giorni in cui hai usato Agorà nelle ultime cinque settimane">${cells}</div>
<p class="h4">Schede lette per categoria</p><div class="bars">${SUITS.map(s=>`<div class="bar"><span>${SN[s]}</span><u><s style="width:${Math.round(100*per[s]/mx)}%;background:${SCOL[s]}"></s></u><em>${per[s]}</em></div>`).join('')}</div>
<p class="h4">Salvati${S.saved.length?' ('+S.saved.length+')':''}</p>${sv||'<p class="note">Tocca il segnalibro su una scheda per ritrovarla qui.</p>'}
<p class="h4">Impostazioni</p>
<div class="row aionly"><span>Feed infinito con Claude<span class="note">Nuove schede quando finiscono quelle del mazzo. Usa il tuo account Claude.</span></span><button type="button" class="sw" id="sw-ai" role="switch" aria-checked="${!!S.ai}" aria-label="Feed infinito con Claude"></button></div>
<div class="row"><span>Azzera progressi e salvati</span><button type="button" class="btn" id="rst">Azzera</button></div>
<p class="note" style="margin-top:16px">Ogni scheda letta entra nel ripasso. Se rispondi giusto torna dopo 1, 3, 7, 16 e 35 giorni; se sbagli torna presto. Il mi piace dà più spazio a quella categoria. ${dref?'I progressi sono salvati nel tuo account Claude.':'I progressi restano su questo dispositivo.'}</p></div>`);
}
function openReader(id){const c=byId[id]||(S.saved.find(s=>s.id===id)||{}).card;if(!c)return;openSheet(`<div class="sh-h"><div><small>${esc(SN[c.c]||'')}${c.k?' · '+esc(c.k):''}</small><h3>${esc(c.t)}</h3></div>${XB}</div><div class="sh-b"><p class="dp">${esc(c.b)}</p>${c.l?`<p class="rl">${esc(c.l)}</p>`:''}<div class="acts"><button type="button" class="btn pri aionly" data-ract="deep" data-id="${esc(id)}">Approfondisci con Claude</button><a class="btn pri extonly" href="${esc(askURL(c))}" target="_blank" rel="noopener">Approfondisci con Claude</a><a class="btn" href="${esc(videoURL(c))}" target="_blank" rel="noopener">Video</a><button type="button" class="btn" data-ract="copy" data-id="${esc(id)}">Copia</button><button type="button" class="btn" data-ract="unsave" data-id="${esc(id)}">Rimuovi</button><button type="button" class="btn" data-ract="back">Indietro</button></div></div>`)}

/* ---------- eventi ---------- */
feed.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const el=b.closest('.card'),it=el?items[+el.dataset.i]:null,c=it&&it.card;
 switch(b.dataset.act){
  case'like':if(c)toggleLike(c);break;
  case'save':if(c)toggleSave(c);break;
  case'copy':if(c)copyCard(c);break;
  case'deep':if(c)openDeep(c);break;
  case'ans':if(it&&el)answer(el,it,+b.dataset.j);break;
  case'next':next(el);break;
  case'aion':S.ai=true;save();if(it&&el){it.type='gen';el.dataset.t='gen'}genFail=false;generate();updGen();break;
  case'gen':genFail=false;generate();break;
  case'tofeed':setMode('perte');break;
  case'reload':boot();break;
 }
});
feed.addEventListener('pointerup',e=>{
 if(e.pointerType==='mouse'&&e.button!==0)return;
 if(e.target.closest('button,a,input'))return;
 const el=e.target.closest('.card');if(!el||el.dataset.t!=='card')return;
 const now=Date.now();
 if(now-lastTap<330&&Math.abs(e.clientX-lx)<32&&Math.abs(e.clientY-ly)<32){
  lastTap=0;const it=items[+el.dataset.i];if(!it||!it.card)return;
  if(!S.liked[it.card.id]){S.liked[it.card.id]={c:it.card.c,at:Date.now()};save();syncUI()}
  burst(el,e.clientX,e.clientY);
 }else{lastTap=now;lx=e.clientX;ly=e.clientY}
});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b)setMode(b.dataset.m)});
$('#me').addEventListener('click',openMe);
scrim.addEventListener('click',closeSheet);
sheet.addEventListener('click',e=>{
 const t=e.target;
 if(t.closest('.x'))return closeSheet();
 const o=t.closest('[data-open]');if(o)return openReader(o.dataset.open);
 const sw=t.closest('#sw-ai');if(sw){S.ai=!S.ai;save();sw.setAttribute('aria-checked',String(S.ai));if(S.ai){genFail=false;maybeGen()}return}
 const rs=t.closest('#rst');if(rs){if(rs.dataset.c){S=def();save();build();closeSheet();reset(true);updTop();toast('Progressi azzerati')}else{rs.dataset.c='1';rs.textContent='Conferma';setTimeout(()=>{if(rs.isConnected){delete rs.dataset.c;rs.textContent='Azzera'}},4000)}return}
 const ra=t.closest('[data-ract]');if(!ra)return;
 const id=ra.dataset.id,c=id?(byId[id]||(S.saved.find(s=>s.id===id)||{}).card):null;
 if(ra.dataset.ract==='deep'&&c)openDeep(c);
 else if(ra.dataset.ract==='copy'&&c)copyCard(c);
 else if(ra.dataset.ract==='unsave'&&c){toggleSave(c);openMe()}
 else if(ra.dataset.ract==='back')openMe();
});
sheet.addEventListener('submit',e=>{e.preventDefault();const bt=$('#qbt');if(bt&&bt.dataset.busy){if(dctl)dctl.abort();return}const i=$('#qin'),v=i?i.value.trim():'';if(!v)return;i.value='';ask(v)});
document.addEventListener('keydown',e=>{
 if(sheetOpen()){if(e.key==='Escape')closeSheet();return}
 if(e.target.closest&&e.target.closest('input,textarea'))return;
 if(e.key==='ArrowDown'||e.key==='j'){e.preventDefault();feed.scrollBy({top:feed.clientHeight,behavior:RM?'auto':'smooth'})}
 else if(e.key==='ArrowUp'||e.key==='k'){e.preventDefault();feed.scrollBy({top:-feed.clientHeight,behavior:RM?'auto':'smooth'})}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flush()});
window.addEventListener('pagehide',flush);

/* ---------- avvio ---------- */
function caps(){
 const C=window.claude;if(!C||typeof C.use!=='function')return;
 C.use('sample').then(f=>{if(typeof f==='function'){sample=f;document.body.classList.add('ai');if(mode!=='ripasso'&&!unseenLeft())refill()}}).catch(()=>{});
 Promise.all([C.use('db'),C.use('user')]).then(async([db,user])=>{
  if(!db||!user)return;const id=await user.id();if(!id)return;
  const ref=db.doc('data/users/'+id+'/agora');
  const snap=await Promise.race([ref.get(),new Promise((_,no)=>setTimeout(()=>no({code:'timeout'}),10000))]);
  dref=ref;
  const remote=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
  if(remote){S=merge(S,remote);try{localStorage.setItem(LSK,JSON.stringify(S))}catch(e){}build();syncUI()}
  if(!remote||JSON.stringify(S)!==JSON.stringify(remote)){dirty=true;flush()}
 }).catch(()=>{});
}
async function boot(){
 const loc=readLocal();if(loc)S=merge(def(),loc);
 try{const r=await fetch('cards.json',{cache:'no-cache'});if(!r.ok)throw new Error('http '+r.status);const j=await r.json();if(!Array.isArray(j)||!j.length)throw new Error('vuoto');seed=j}
 catch(e){feed.innerHTML=`<article class="card" data-t="err"><div class="pic">${vignette('scroll',5)}</div><div class="txt"><h2>Non riesco a caricare le schede</h2><p class="body">Controlla la connessione e riprova.</p><div class="acts"><button type="button" class="btn pri" data-act="reload">Riprova</button></div></div></article>`;return}
 build();renderTabs();reset(true);updTop();
 if(!boot.done){boot.done=true;caps()}
}
if(EXT){document.body.classList.add('ext');if('serviceWorker'in navigator&&/^(https:|http:\/\/(localhost|127\.0\.0\.1))/.test(location.href))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
boot();
}
